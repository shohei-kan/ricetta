name: Task
description: ドキュメント、テスト、リファクタリング、運用作業など
labels:
  - chore

body:
  - type: markdown
    attributes:
      value: |
        機能追加や不具合修正に該当しない作業内容を整理してください。

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 実施する作業を簡潔に記載してください。
      placeholder: |
        例：
        READMEに公開デモの推奨操作フローを追加する。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: この作業が必要になった背景を記載してください。
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 実施する作業をチェックリスト形式で記載してください。
      placeholder: |
        - [ ] 推奨操作フローを整理する
        - [ ] READMEに手順を追加する
        - [ ] リンクとアカウント情報を確認する
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Issueを完了と判断できる条件を記載してください。
      placeholder: |
        - [ ] READMEから公開デモへ移動できる
        - [ ] 初めて見る人が確認順を理解できる
        - [ ] 表記内容が現在のデモと一致している
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 作業完了後の確認方法を記載してください。
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 関連Issue、参考資料、補足事項などがあれば記載してください。
    validations:
      required: false