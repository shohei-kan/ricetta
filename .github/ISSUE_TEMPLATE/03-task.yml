name: 作業タスク
description: インフラ、テスト、調査、文書化などの作業を管理します
title: "chore: "
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        実装以外も含む、具体的な作業内容を整理してください。

  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: なぜこの作業を行うのか記載してください。
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 対応内容
      description: 実施する作業を記載してください。
      placeholder: |
        - バックアップスクリプトを作成する
        - 定期実行を設定する
        - 復元手順を文書化する
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 作業完了と判断する条件を記載してください。
      placeholder: |
        - [ ] バックアップファイルが作成される
        - [ ] 復元テストに成功する
        - [ ] 手順書が更新されている
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: 結果を確認する方法やコマンドを記載してください。
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 関連資料、検討事項、関連Issueなどがあれば記載してください。
    validations:
      required: false