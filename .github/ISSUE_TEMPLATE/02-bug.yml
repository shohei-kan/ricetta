name: Bug
description: 不具合や想定外の動作を報告
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        発生している不具合と再現方法を整理してください。

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 発生している不具合を簡潔に記載してください。
      placeholder: |
        例：
        スマートフォン表示でボトムナビゲーションが画面外にはみ出す。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 不具合を再現する手順を記載してください。
      placeholder: |
        1. ownerでログインする
        2. レシピ詳細画面を開く
        3. 画面幅を375pxにする
        4. 画面下部を確認する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 本来期待している動作を記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: 実際に発生している動作を記載してください。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 不具合が発生した環境を記載してください。
      placeholder: |
        - Environment: Public demo / Local
        - Device: iPhone 12 mini
        - OS: iOS
        - Browser: Safari
        - App version: v0.1.0
    validations:
      required: false

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 修正後に確認する内容を記載してください。
      placeholder: |
        - [ ] 同じ手順で不具合が再現しない
        - [ ] 他の画面幅でも表示が崩れない
        - [ ] 既存機能に影響がない
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: スクリーンショット、ログ、関連Issueなどがあれば記載してください。
    validations:
      required: false