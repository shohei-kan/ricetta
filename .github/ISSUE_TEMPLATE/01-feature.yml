name: Feature
description: 新しい機能や既存機能の改善
title: ""
labels:
  - feature

body:
  - type: markdown
    attributes:
      value: |
        新しい機能や既存機能の改善内容を整理してください。

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: この機能によって、誰のどんな課題を解決するか記載してください。
      placeholder: |
        例：
        仕込み担当者が、当日の作業状況を把握しやすくする。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: この対応が必要になった背景を記載してください。
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 実装または変更する内容をチェックリスト形式で記載してください。
      placeholder: |
        - [ ] 未着手の仕込みを上段に表示する
        - [ ] 完了した仕込みを下段へ移動する
        - [ ] レスポンシブ表示を確認する
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Issueを完了と判断できる条件を記載してください。
      placeholder: |
        - [ ] 未着手と完了済みを区別できる
        - [ ] スマホ・タブレット・PCで正常に表示される
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 実装後の動作確認方法を記載してください。
      placeholder: |
        1. ownerでログインする
        2. 今日の仕込み画面を開く
        3. 仕込みを完了に変更する
        4. 完了済みの領域へ移動することを確認する
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 関連Issue、参考資料、画面イメージなどがあれば記載してください。
    validations:
      required: false