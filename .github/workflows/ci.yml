name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ricetta_test
          POSTGRES_USER: ricetta
          POSTGRES_PASSWORD: ricetta
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run Django checks
        run: |
          cd backend
          python manage.py check
      - name: Run migration check
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          cd backend
          python manage.py test
        env:
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: True
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          POSTGRES_DB: ricetta_test
          POSTGRES_USER: ricetta
          POSTGRES_PASSWORD: ricetta
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run build
        run: |
          cd frontend
          npm run build
      - name: Run lint
        run: |
          cd frontend
          npm run lint